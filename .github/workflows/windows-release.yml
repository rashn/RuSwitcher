name: windows-release

# Windows releases use two signing requests so the installers contain an already-signed app:
# build apps -> sign apps -> build installers -> sign installers -> publish.
# Production requests require manual approval in SignPath; test-signing requests do not.
on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.10.0-beta.1), for manual runs'
        required: true

permissions:
  actions: read
  contents: write

env:
  SIGNPATH_PROJECT_SLUG: RuSwitcher
  SIGNPATH_APP_CONFIGURATION: windows-apps-zip
  SIGNPATH_INSTALLER_CONFIGURATION: windows-installers-zip
  SIGNPATH_SIGNING_POLICY: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}

jobs:
  build-apps:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      numeric_version: ${{ steps.ver.outputs.numeric_version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      unsigned_apps_artifact_id: ${{ steps.upload-unsigned-apps.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^win-v',''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $v"
          }
          $numericParts = @([regex]::Matches($v, '\d+') | Select-Object -First 4 | ForEach-Object { [int]$_.Value })
          while ($numericParts.Count -lt 4) { $numericParts += 0 }
          $numericVersion = $numericParts -join '.'
          $pre = if ($v -like '0.*' -or $v -match '-') { 'true' } else { 'false' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric_version=$numericVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v numeric_version=$numericVersion prerelease=$pre"

      - name: Configure and build compact native binaries
        shell: pwsh
        run: |
          cmake -S windows/native -B build/native-x64 -A x64 `
            "-DRUSWITCHER_VERSION=${{ steps.ver.outputs.version }}" `
            "-DRUSWITCHER_VERSION_NUMERIC=${{ steps.ver.outputs.numeric_version }}"
          cmake --build build/native-x64 --config Release
          cmake -S windows/native -B build/native-arm64 -A ARM64 `
            "-DRUSWITCHER_VERSION=${{ steps.ver.outputs.version }}" `
            "-DRUSWITCHER_VERSION_NUMERIC=${{ steps.ver.outputs.numeric_version }}"
          cmake --build build/native-arm64 --config Release
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check_windows_binary_size.ps1 build/native-x64/Release/RuSwitcher.exe -MaximumMiB 5
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check_windows_binary_size.ps1 build/native-arm64/Release/RuSwitcher.exe -MaximumMiB 5
          New-Item -ItemType Directory -Force -Path unsigned-apps | Out-Null
          Copy-Item build/native-x64/Release/RuSwitcher.exe "unsigned-apps/RuSwitcher-${{ steps.ver.outputs.version }}-win-x64.exe"
          Copy-Item build/native-arm64/Release/RuSwitcher.exe "unsigned-apps/RuSwitcher-${{ steps.ver.outputs.version }}-win-arm64.exe"

      - name: Upload unsigned applications
        id: upload-unsigned-apps
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-apps-${{ steps.ver.outputs.version }}
          path: unsigned-apps/
          if-no-files-found: error
          retention-days: 1

  sign-apps:
    needs: build-apps
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Sign x64 and ARM64 applications with SignPath
        id: sign-apps
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_APP_CONFIGURATION }}
          github-artifact-id: ${{ needs.build-apps.outputs.unsigned_apps_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed-apps
          parameters: |
            version: ${{ toJSON(needs.build-apps.outputs.version) }}

      - name: Report SignPath application request failure
        if: ${{ failure() && steps.sign-apps.outputs.signing-request-id != '' }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_REQUEST_ID: ${{ steps.sign-apps.outputs.signing-request-id }}
        run: |
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN"; Accept = 'application/json' }
          $uri = "https://app.signpath.io/Api/v1/$env:SIGNPATH_ORGANIZATION_ID/SigningRequests/$env:SIGNPATH_REQUEST_ID"
          $request = Invoke-RestMethod -Uri $uri -Headers $headers
          Write-Host "SignPath status: $($request.status)"
          Write-Host "SignPath workflow status: $($request.workflowStatus)"
          Write-Host "SignPath malware scan: $($request.malwareScanningStatus)"
          Write-Host "SignPath artifact configuration: $($request.artifactConfigurationSlug)"
          Write-Host "SignPath signing policy: $($request.signingPolicySlug)"

      - name: Verify signed applications
        shell: pwsh
        run: |
          $v = '${{ needs.build-apps.outputs.version }}'
          $expected = @("RuSwitcher-$v-win-x64.exe", "RuSwitcher-$v-win-arm64.exe")
          foreach ($name in $expected) {
            $file = Get-ChildItem signed-apps -Recurse -File -Filter $name
            if (@($file).Count -ne 1) { throw "Expected one signed $name" }
            if (-not (Get-AuthenticodeSignature $file.FullName).SignerCertificate) {
              throw "SignPath returned $name without an Authenticode signature"
            }
          }

      - name: Upload signed applications for installer build
        uses: actions/upload-artifact@v7
        with:
          name: signed-apps-${{ needs.build-apps.outputs.version }}
          path: signed-apps/
          if-no-files-found: error
          retention-days: 1

  build-installers:
    needs: [build-apps, sign-apps]
    runs-on: windows-latest
    outputs:
      unsigned_installers_artifact_id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed applications
        uses: actions/download-artifact@v4
        with:
          name: signed-apps-${{ needs.build-apps.outputs.version }}
          path: signed-apps

      - name: Build installers around signed applications
        shell: pwsh
        run: |
          choco upgrade innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $v = '${{ needs.build-apps.outputs.version }}'
          $numeric = '${{ needs.build-apps.outputs.numeric_version }}'
          & $iscc "/DMyAppVersion=$v" "/DMyAppNumericVersion=$numeric" `
                  "/DSourceExe=${{ github.workspace }}\signed-apps\RuSwitcher-$v-win-x64.exe" `
                  "/DMyAppArch=x64" windows\installer\RuSwitcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC x64 failed with exit $LASTEXITCODE" }
          & $iscc "/DMyAppVersion=$v" "/DMyAppNumericVersion=$numeric" `
                  "/DSourceExe=${{ github.workspace }}\signed-apps\RuSwitcher-$v-win-arm64.exe" `
                  "/DMyAppArch=arm64" windows\installer\RuSwitcher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ARM64 failed with exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path unsigned-installers | Out-Null
          Copy-Item windows\installer\dist\*.exe unsigned-installers\

      - name: Upload unsigned installers
        id: upload-unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers-${{ needs.build-apps.outputs.version }}
          path: unsigned-installers/
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: [build-apps, sign-apps, build-installers]
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Sign x64 and ARM64 installers with SignPath
        id: sign-installers
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_CONFIGURATION }}
          github-artifact-id: ${{ needs.build-installers.outputs.unsigned_installers_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed-installers
          parameters: |
            version: ${{ toJSON(needs.build-apps.outputs.version) }}

      - name: Report SignPath installer request failure
        if: ${{ failure() && steps.sign-installers.outputs.signing-request-id != '' }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_REQUEST_ID: ${{ steps.sign-installers.outputs.signing-request-id }}
        run: |
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN"; Accept = 'application/json' }
          $uri = "https://app.signpath.io/Api/v1/$env:SIGNPATH_ORGANIZATION_ID/SigningRequests/$env:SIGNPATH_REQUEST_ID"
          $request = Invoke-RestMethod -Uri $uri -Headers $headers
          Write-Host "SignPath status: $($request.status)"
          Write-Host "SignPath workflow status: $($request.workflowStatus)"
          Write-Host "SignPath malware scan: $($request.malwareScanningStatus)"
          Write-Host "SignPath artifact configuration: $($request.artifactConfigurationSlug)"
          Write-Host "SignPath signing policy: $($request.signingPolicySlug)"

      - name: Verify signed installers
        shell: pwsh
        run: |
          $v = '${{ needs.build-apps.outputs.version }}'
          $expected = @("RuSwitcher-Setup-$v-x64.exe", "RuSwitcher-Setup-$v-arm64.exe")
          foreach ($name in $expected) {
            $file = Get-ChildItem signed-installers -Recurse -File -Filter $name
            if (@($file).Count -ne 1) { throw "Expected one signed $name" }
            if (-not (Get-AuthenticodeSignature $file.FullName).SignerCertificate) {
              throw "SignPath returned $name without an Authenticode signature"
            }
          }

      - name: Download signed applications
        uses: actions/download-artifact@v4
        with:
          name: signed-apps-${{ needs.build-apps.outputs.version }}
          path: signed-apps

      - name: Stage assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item signed-apps\*.exe assets\
          Copy-Item signed-installers\*.exe assets\
          $lines = Get-ChildItem assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii assets\SHA256SUMS.txt
          Get-Content assets\SHA256SUMS.txt

      - name: Upload test-signed assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: RuSwitcher-${{ needs.build-apps.outputs.version }}-test-signed
          path: assets/
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ needs.build-apps.outputs.version }}'
          $notes = "RuSwitcher for Windows $v`n`nAssets: portable single-file exe (x64/arm64) and an installer.`n`nSHA256:`n" + (Get-Content assets\SHA256SUMS.txt -Raw)
          $notes | Out-File -Encoding utf8 notes.md
          $ghArgs = @("win-v$v") + (Get-ChildItem assets\* | ForEach-Object { $_.FullName }) +
                    @('--title', "RuSwitcher for Windows $v", '--notes-file', 'notes.md',
                      '--target', '${{ github.sha }}')
          if ('${{ needs.build-apps.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
