name: windows-build

# Builds the Windows version on a real Windows runner — the only way to verify it,
# since the maintainer works on macOS. Also the project's first build CI (the audit
# flagged that pushes were never compile-checked).
on:
  push:
    branches: [wip/windows, windows-port, main]
    paths:
      - 'windows/**'
      - 'scripts/check_windows_binary_size.ps1'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/check_windows_binary_size.ps1'
  workflow_dispatch:

jobs:
  native-size:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure compact native target
        run: cmake -S windows/native -B build/native-${{ matrix.architecture }} -A ${{ matrix.architecture }}
      - name: Build compact native target
        run: cmake --build build/native-${{ matrix.architecture }} --config Release
      - name: Enforce standalone executable budget
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass
          -File scripts/check_windows_binary_size.ps1
          build/native-${{ matrix.architecture }}/Release/RuSwitcher.exe -MaximumMiB 5

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build windows/src/RuSwitcher.Win/RuSwitcher.Win.csproj -c Release --nologo

      - name: Test (pure-logic unit tests)
        run: dotnet test windows/tests/RuSwitcher.Win.Tests/RuSwitcher.Win.Tests.csproj -c Release --nologo

      # Self-contained single .exe — runs on any Windows x64 without installing .NET.
      # Download it from this run's "Artifacts" section to test on a real machine.
      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/RuSwitcher.Win/RuSwitcher.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish --nologo

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuSwitcher-win-x64
          path: publish/RuSwitcher.exe
          if-no-files-found: error
